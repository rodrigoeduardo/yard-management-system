name: CI checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Runs against a disposable local Supabase stack (Docker, via the
  # Supabase CLI) instead of the shared remote project — no remote
  # credentials involved, and each run gets its own stack (the runner VM),
  # so concurrent runs can't interfere with each other or with local runs.
  # See scripts/setup-local-integration-stack.ts.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration:setup
      - run: npm run test:integration
