name: CI checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Runs against a disposable local Supabase stack (Docker, via the
  # Supabase CLI) instead of the shared remote project — no remote
  # credentials involved, and each run gets its own stack (the runner VM),
  # so concurrent runs can't interfere with each other or with local runs.
  # See scripts/setup-local-integration-stack.ts.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration:setup
      - run: npm run test:integration

  # Applies pending Drizzle migrations to the shared Supabase database after
  # a merge to main. Vercel's build only runs `next build` — it does not run
  # migrations (see docs/workflow/deploy.md "Known gap") — so without this,
  # schema changes never reach the database until someone runs
  # `npm run db:migrate` by hand.
  migrate:
    needs: [checks, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
